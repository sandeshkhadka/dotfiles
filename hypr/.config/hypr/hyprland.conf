
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=,1920x1080,auto,1,bitdepth,8
monitor=,preferred,auto,1,mirror,eDP-1,bitdepth,8
xwayland {
	force_zero_scaling = true
}
cursor {
    no_hardware_cursors = true
}
splash = false


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = footclient
$fileManager = thunar
$browser = firefox
$menu = rofi -show drun -run-shell-command 'source /home/sandesh/.zsh_profile && {terminal} -e zsh -ic "{cmd} && read"'


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = uwsm app -- nm-applet &
exec-once = uwsm app -- waybar
exec-once = wl-paste --watch cliphist store
exec-once = uwsm app -- blueman-applet
# exec-once = uwsm app -- hypridle
exec-once = systemctl --user start hyprpolkitagent
# exec-once = systemctl --user start foot-server.service
# exec-once = systemctl --user start noctalia.service

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1



#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general

# https://wiki.hyprland.org/Configuring/Variables/#decoration
general {
  gaps_in = 1
  gaps_out = 1
}

decoration {
  rounding = 0
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

# layerrule {
#   name = noctalia
#   match:namespace = noctalia-background-.*$
#   ignore_alpha = 0.5
#   blur = true
#   blur_popups = true
# }
# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = no

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 1.94, almostLinear, fade
    # animation = workspaces, 1, 1.94, almostLinear, fade
    # animation = workspacesIn, 1, 1.21, almostLinear, fade
    # animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = true
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more


bind = Alt, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager

# Toggle waybar

bind = $mainMod, Q, killactive,
bind = $mainMod, M, fullscreen,1
bind = $mainMod SHIFT, M, fullscreen,0
bind = $mainMod, Y, togglefloating,

# bind = $mainMod, J, togglesplit, # dwindle
# screenshot 
 bind =, Print, exec, uwsm app -- grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png 
 bind = SHIFT, Print, exec, uwsm app -- grim - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png 

#clipboard

# #powermenu
# bind = Alt, 0,exec, ~/bin/powerdmenu

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, P,exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy 
bind = $mainMod, Return, exec, rofimoji -a type copy
bind = $mainMod, Slash, exec, $menu
bind = $mainMod, Space, exec, $menu
# bind =  $mainMod, N, exec, qs -c noctalia-shell ipc call notifications toggleHistory
# bind =  $mainMod SHIFT, N, exec, qs -c noctalia-shell ipc call notifications toggleDND
bind = $mainMod, W, exec, killall -SIGUSR1 waybar || waybar
bind =  Alt, 0,exec, ~/bin/powerdmenu

bind =  $mainMod, P,exec, qs -c noctalia-shell ipc call launcher clipboard
bind =  $mainMod, Return, exec, qs -c noctalia-shell ipc call launcher emoji
bind =  $mainMod, Slash, exec, qs -c noctalia-shell ipc call launcher toggle
bind =  $mainMod, N, exec, qs -c noctalia-shell ipc call notifications toggleHistory
bind =  $mainMod SHIFT, N, exec, qs -c noctalia-shell ipc call notifications toggleDND
bind =  $mainMod, V, exec, qs -c noctalia-shell ipc call controlCenter toggle
# bind = $mainMod, F, exec, qs -c noctalia-shell ipc call bar toggle
# bind =  Alt, 0,exec, qs -c noctalia-shell ipc call sessionMenu toggle


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


binde = SUPER CTRL, h, resizeactive, -20 0
binde = SUPER CTRL, l, resizeactive,  20 0
binde = SUPER CTRL, k, resizeactive,  0 -20
binde = SUPER CTRL, j, resizeactive,  0  20
# Laptop multimedia keys for volume and LCD brightness
binde = , XF86AudioLowerVolume, exec,qs -c noctalia-shell ipc call volume decrease
binde = , XF86AudioRaiseVolume, exec, qs -c noctalia-shell ipc call volume increase
binde = , XF86AudioMute, exec, qs -c noctalia-shell ipc call volume muteOutput
binde = , XF86MonBrightnessUp, exec,qs -c noctalia-shell ipc call brightness increase
binde = , XF86MonBrightnessDown, exec,qs -c noctalia-shell ipc call brightness decrease


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################


# assign workspace to apps
windowrule = match:class ^(footclient)$, workspace 2
windowrule = match:class ^(firefox|zen-browser|zen)$, workspace 3
windowrule = match:class ^(discord|vesktop)$,workspace 4
windowrule = match:class ^(org.pwmt.zathura)$, workspace 1

# floating windows
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on


# viber
windowrule = match:class ^(ViberPC|viber)$, pin on
windowrule = match:class ^(ViberPC|viber)$, suppress_event activatefocus

# microphone stuff
exec-once=pactl set-source-volume @DEFAULT_SOURCE@ 32%

# Screen Sharing stuff
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = udiskie -ant

windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

source = ~/.config/hypr/noctalia/noctalia-colors.conf



#NVIDIA
# Fix for NVIDIA screen sharing "black screen" blit failures
env = AQ_FORCE_LINEAR_BLIT,1

# Standard NVIDIA Wayland variables
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
